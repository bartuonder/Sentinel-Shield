version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - sentinel_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinel_frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge