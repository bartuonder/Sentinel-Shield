version: '3.8'

services:
  backend:
    build: .
    container_name: sentinel_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - sentinel_net

  frontend:
    build: .
    container_name: sentinel_frontend
    command: streamlit run dashboard_ui.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge