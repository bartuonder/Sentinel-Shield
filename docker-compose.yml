version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_backend
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - sentinel_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: sentinel_frontend
    expose:
      - "3000"
    networks:
      - sentinel_net

  nginx:
    image: nginx:alpine
    container_name: sentinel_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge